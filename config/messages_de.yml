# Erfolgswert (EW): Wurf + PW + Mod
# Probenwert (PW): ggf. zählt PWT
r_help: |
  Würfelt mit Würfeln.
  2d6+3: Addiert das Ergebnis von 2 6-seitigen Würfeln und 3.
  2@3d20: Würfelt 3d20 und nimmt das zweithöchste Ergebnis, z.B. (20,15,5) => 15.
  Spezielle Würfe:
  I: 1d20, Io: 1@2d20, Ioo 1@3d20
  III: 2@3d20, III': 2@4d20, III'' 2@5d20
  Trefferzonen (Optionalregel, S. 33):
  !tp 2w6+3: Würfelt Schaden und 1W6 für die Trefferzone, siehe !help tp.
  🎯 Button unter normalen Würfen (z.B. 2w6+3, nicht bei I, III oder @): Würfelt 1W6 für die Trefferzone und ergänzt das Ergebnis.
  Nur wer gewürfelt hat kann ihn drücken, einmal pro Wurf, innerhalb von 10 Minuten.
r_desc: "Zeichenkette zum Parsen der Würfel."
r_result: |
  ```md
  # {author} --- {identifier} {result}
  Details: {details}
  ```
r_title: "Ergebnis"
r_success: "Erfolg"
r_fail: "Fehlschlag"
r_difficulty: "Schwierigkeit"

tp_help: |
  Würfelt Schaden (TP) und zusätzlich 1W6 für die Trefferzone (Optionalregel Trefferzonen, S. 33).
  Beispiel: !tp 2w6+3 Säbel
  Die TP vergleichst du mit der Zonen-Wundschwelle (ZWS*) der getroffenen Zone.
  Trefferzonen (W6): 1 Beine, 2 Schildarm, 3 Schwertarm, 4 Bauch, 5 Brust, 6 Kopf
  Aliase: !schaden, !dmg
tp_desc: "Schadenswurf, z.B. 2w6+3"
tp_identifier: "Name des Angriffs/der Waffe (optional)"
tp_title: "Schaden"

