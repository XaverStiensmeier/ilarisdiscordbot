  2: {emoji: "🛡️", name: "Schildarm", check: "KK", effect: "Entwaffnet – die Waffe dieser Hand fällt zu Boden."}
  3: {emoji: "🗡️", name: "Schwertarm", check: "KK", effect: "Entwaffnet – die Waffe dieser Hand fällt zu Boden."}
  4: {emoji: "🫘", name: "Bauch", check: "KO", effect: "Organtreffer – das Opfer erleidet eine Zusatzwunde."}
  5: {emoji: "🫁", name: "Brust", check: "KO", effect: "Organtreffer – das Opfer erleidet eine Zusatzwunde."}
  6: {emoji: "🧠", name: "Kopf", check: "MU", effect: "Betäubt – wie Wundschmerz in den Basisregeln (S. 31)."}

